# Opcional — PostgreSQL para quando a aplicação migrar do SQLite.
# Uso: docker compose up -d
# Depois ajuste DATABASE_URL e o provider no schema.prisma.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus_stream
    ports:
      - "5432:5432"
    volumes:
      - nexus_pg_data:/var/lib/postgresql/data

volumes:
  nexus_pg_data:
